[package]
name = "oshwhub-nsh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
nsh-core = "=0.4.0"
nsh-base = "=0.4.0"
env_logger = "0.11"
oshwhub-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "=0.4.0", default-features = false }

[dev-dependencies]
nsh-engine = { version = "=0.4.0", default-features = false }
nsh-testing = { version = "=0.4.0", default-features = false }

[package]
name = "oshwhub-nsh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
nsh-core = "=0.4.0"
nsh-base = "=0.4.0"
env_logger = "0.11"
oshwhub-core.workspace = true
serde_json.workspace = true
url.workspace = true
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
pollster = "0.4"
resvg = { version = "=0.46.0", default-features = false, features = ["text", "raster-images"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.4.0", default-features = false }
glow = "=0.17.0"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.4.0", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }
wgpu = { version = "=29.0.4", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { version = "=0.4.0", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }
objc2-ui-kit = { version = "=0.3.2", default-features = false, features = ["std", "UIView", "UIWindow", "UIScreen", "objc2-quartz-core"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "=0.4.0", default-features = false }
windows = { version = "=0.62.2", features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc"] }
naga = { version = "=29.0.4", default-features = false, features = ["wgsl-in", "hlsl-out"] }

[target.'cfg(target_os = "android")'.dependencies]
nsh-platform-android = { version = "=0.4.0", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { version = "=29.0.4", default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "=29.0.4", default-features = false, features = ["webgpu", "webgl"] }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CssStyleDeclaration", "Node", "Storage", "WebGl2RenderingContext", "WebglLoseContext"] }

[dev-dependencies]
nsh-engine = { version = "=0.4.0", default-features = false }
nsh-testing = { version = "=0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dev-dependencies]
wgpu = { version = "=29.0.4", default-features = false, features = ["dx12"] }

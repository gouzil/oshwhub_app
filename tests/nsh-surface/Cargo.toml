[package]
name = "oshwhub-nsh-surface-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "=0.4.0"
nsh-base = "=0.4.0"
oshwhub-nsh = { path = "../../apps/nsh" }
oshwhub-core = { path = "../../crates/core" }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.4.0", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { version = "=0.4.0", default-features = false }

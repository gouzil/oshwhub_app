name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust NSH native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libegl-dev libgles-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: j178/prek-action@v1
      - run: pnpm build:web
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quality-diagnostics
          path: |
            playwright-report
            test-results

  nsh-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    env:
      RUST_MIN_STACK: '268435456'
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libgtk-4-dev libegl-dev libgles-dev xvfb
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo install nsh-cli --version 0.4.0 --locked
      - run: cargo test -p oshwhub-nsh --locked
      - run: cargo clippy -p oshwhub-nsh --all-targets --locked -- -D warnings
      - name: Verify GTK GPU pixels and lifecycle
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p oshwhub-nsh --locked --test linux_surface -- --ignored
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: pnpm build:nsh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: nsh-${{ matrix.target }}
          path: apps/nsh/.nsh/out/${{ matrix.target }}/
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      RUST_MIN_STACK: '268435456'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'ndk;27.1.12297006' 'platforms;android-35' 'platforms;android-37.0' 'build-tools;37.0.0' 'cmake;3.22.1'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:android
      - run: pnpm --filter @oshwhub/mobile exec expo prebuild --platform android --no-install
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-development-signature
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - run: cargo install nsh-cli --version 0.4.0 --locked
      - run: pnpm build:nsh android
      - name: Build NSH Android GPU probe
        run: |
          node --input-type=module <<'JS'
          import { androidRuntime } from './scripts/nsh-android-host.mjs';
          import { execFileSync } from 'node:child_process';
          execFileSync('nsh', ['package', '--target', 'android', '--abi', 'x86_64'], {
            cwd: 'tests/nsh-surface', stdio: 'inherit',
            env: { ...process.env, NSH_RUNTIME: androidRuntime() },
          });
          JS
      - name: Verify NSH Android GPU lifecycle (software GPU)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -feature Vulkan
          script: |
            adb install -r tests/nsh-surface/.nsh/out/SurfaceProbe.apk
            NSH_ANDROID_SERIAL=emulator-5554 node scripts/nsh-android-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nsh-android-development-signature
          path: |
            apps/nsh/.nsh/out/android/*.apk
            .superpowers/sdd/nsh-migration-plan/android-gpu/
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    env:
      RUST_MIN_STACK: '268435456'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-rust.mjs ios
      - run: pnpm --filter @oshwhub/mobile exec expo prebuild --platform ios
      - name: Build iPhone and iPad simulator app
        run: xcodebuild -workspace OSHWHub.xcworkspace -scheme OSHWHub -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/mobile/ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: apps/mobile/ios/build/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error
      - run: cargo install nsh-cli --version 0.4.0 --locked
      - run: pnpm build:nsh ios-simulator
      - uses: actions/upload-artifact@v4
        with:
          name: nsh-ios-simulator-app
          path: apps/nsh/.nsh/out/ios-simulator/*.app
          if-no-files-found: error
